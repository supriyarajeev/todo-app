<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do — Stay organized</title>
  <meta name="description" content="A simple, fast to-do list that stores tasks in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>
  <a class="skip-link" href="#task-list">Skip to task list</a>

  <div class="shell">

    <!-- ============ Left rail ============ -->
    <aside class="rail">
      <div class="rail-top">
        <div class="brand">
          <h1 class="wordmark">To&#8209;Do</h1>
          <p class="tagline">Stay organized.<br />Get things done.</p>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <nav class="views" aria-label="Task views">
        <button class="view is-active" type="button" data-view="all" aria-pressed="true">
          <span class="view-name">All</span>
          <span class="view-count" data-count="all">0</span>
        </button>
        <button class="view" type="button" data-view="active" aria-pressed="false">
          <span class="view-name">Active</span>
          <span class="view-count" data-count="active">0</span>
        </button>
        <button class="view" type="button" data-view="completed" aria-pressed="false">
          <span class="view-name">Completed</span>
          <span class="view-count" data-count="completed">0</span>
        </button>
        <button class="view" type="button" data-view="archived" aria-pressed="false">
          <span class="view-name">Archived</span>
          <span class="view-count" data-count="archived">0</span>
        </button>
      </nav>

      <section class="refine" aria-label="Filters">
        <h2 class="rail-label">Refine</h2>
        <div class="refine-grid">
          <label class="field">
            <span>Priority</span>
            <select id="filter-priority">
              <option value="all">Any</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label class="field">
            <span>Category</span>
            <select id="filter-category"><option value="all">Any</option></select>
          </label>
          <label class="field">
            <span>Due</span>
            <select id="filter-due">
              <option value="all">Any</option>
              <option value="overdue">Overdue</option>
              <option value="today">Today</option>
              <option value="week">Next 7 days</option>
              <option value="none">No due date</option>
            </select>
          </label>
          <label class="field">
            <span>Sort</span>
            <select id="sort-by">
              <option value="created-desc">Newest first</option>
              <option value="created-asc">Oldest first</option>
              <option value="due-asc">Due date</option>
              <option value="priority-desc">Priority</option>
              <option value="title-asc">Title A–Z</option>
            </select>
          </label>
        </div>
        <button id="clear-filters" class="link-btn" type="button">Reset filters</button>
      </section>

      <p class="rail-foot">Saved in this browser only.</p>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <div class="commandbar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks by title or description" />
        </div>
        <button id="add-task-btn" class="btn btn-primary" type="button">
          <span aria-hidden="true">+</span> Add Task
        </button>
      </div>

      <div class="ledger">
        <div class="ledger-head" aria-hidden="true">
          <span class="lh-task">Task</span>
          <span class="lh-due">Due</span>
          <span class="lh-actions"></span>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite" aria-label="Tasks"></ul>

        <div id="empty-state" class="empty" hidden>
          <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" class="empty-mark">
            <path d="M10 6h28v36H10z" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M17 17h14M17 24h14M17 31h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <h2 id="empty-title">Nothing here yet</h2>
          <p id="empty-text">Add your first task to get started.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ Add / Edit dialog ============ -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Add Task</h2>
      <form id="task-form" novalidate>
        <label class="field">
          <span>Title <span class="req" aria-hidden="true">*</span></span>
          <input id="f-title" name="title" type="text" required maxlength="200"
                 aria-required="true" aria-describedby="title-error" placeholder="e.g. Finish Product School course" />
          <small id="title-error" class="error" role="alert" hidden>Please enter a task title.</small>
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="f-description" name="description" rows="3" maxlength="1000" placeholder="Optional notes..."></textarea>
        </label>

        <div class="row">
          <label class="field">
            <span>Due date</span>
            <input id="f-dueDate" name="dueDate" type="date" />
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="f-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Category</span>
          <input id="f-category" name="category" type="text" maxlength="40" list="category-list" placeholder="e.g. Learning" />
          <datalist id="category-list"></datalist>
        </label>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn">Cancel</button>
          <button type="submit" id="modal-save" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ Confirm dialog ============ -->
  <div id="confirm-overlay" class="modal-overlay" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 id="confirm-title">Delete task?</h2>
      <p id="confirm-text">This permanently removes the task. Archiving keeps it instead, and can be undone.</p>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="btn">Cancel</button>
        <button type="button" id="confirm-ok" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
